<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Madam Ji ❤️</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e7,#fff1f7);overflow:hidden}
.card{width:min(88%,420px);padding:32px 24px;text-align:center;background:#ffffffcc;
border-radius:28px;box-shadow:0 15px 45px #d66a9b55}
h1{color:#e83e8c;font-size:32px;margin:0 0 14px}
p{color:#555;font-size:18px;line-height:1.6}
.heart{font-size:55px;animation:pulse 1.2s infinite}
button{border:0;border-radius:999px;padding:13px 24px;background:#e83e8c;color:white;
font-size:17px;cursor:pointer}
#msg{display:none;margin-top:18px;color:#e83e8c;font-weight:bold}
@keyframes pulse{50%{transform:scale(1.18)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">❤️</div>
<h1>Sorry Madam Ji 🥺</h1>
<p>Gussa thoda sa kam kar do na...<br>
Galti ho gayi, dil se sorry! 🙈<br>
Aapki smile zyada achhi lagti hai. 😊</p>
<button onclick="document.getElementById('msg').style.display='block'">Maan jao na 🥺❤️</button>
<div id="msg">Promise — ab aapko manaane mein koi kasar nahi chhodunga! 😄❤️</div>
</div>
</body>
</html>
